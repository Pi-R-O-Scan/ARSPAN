name: Mettre à jour les données TDS

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 minutes (peut être retardé de quelques minutes)
  workflow_dispatch:         # lancement manuel possible
    inputs:
      display:
        description: "Période à lire (optionnel, non testé) : week, month, year, display_3years..."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tds-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests

      - name: Récupérer les mesures
        env:
          TDS_USER: ${{ secrets.TDS_USER }}
          TDS_PASS: ${{ secrets.TDS_PASS }}
          TDS_DISPLAY: ${{ github.event.inputs.display }}
        run: python scrape_tds.py

      - name: Publier data.json
        run: |
          git config user.name "tds-bot"
          git config user.email "tds-bot@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Mise à jour des mesures"
            git pull --rebase -X theirs origin main
            git push
          fi
