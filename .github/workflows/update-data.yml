name: Mettre à jour les données TDS
on:
  schedule:
    # - cron: "*/30 * * * *"      # ancien rythme : toutes les 30 minutes (désactivé)
    # - cron: "17 23 * * *"       # ancien rythme : tous les jours à 23h17 UTC (1h17 à Paris)
    - cron: "17 5,11,17,23 * * *"       # actuel rythme : tous les jours à 05h17 + 11h17 + 17h17 + 23h17 UTC (1h17 à Paris)
  workflow_dispatch:
    inputs:
      display:
        description: "Période à lire (optionnel) : week, month, year..."
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: tds-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install requests
      - name: Récupérer les mesures
        env:
          TDS_USER: ${{ secrets.TDS_USER }}
          TDS_PASS: ${{ secrets.TDS_PASS }}
          TDS_DISPLAY: ${{ github.event.inputs.display }}
        run: python scrape_tds.py
      - name: Publier data.json
        run: |
          git config user.name "tds-bot"
          git config user.email "tds-bot@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git commit -m "Mise à jour des mesures"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
